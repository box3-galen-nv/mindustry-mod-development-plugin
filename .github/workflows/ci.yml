name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin targets Java 17 bytecode; the newer JDKs prove it still builds and runs on them.
        jdk: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk${{ matrix.jdk }}
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore

  cross-platform:
    name: Sanity (${{ matrix.os }})
    # Not blocking yet: the Android path is known to be broken on Windows (only `d8.bat` is installed
    # there, while the plugin looks for `d8`), and the suite has never been run on either platform.
    # Keep the red visible without letting it block every pull request.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --stacktrace

  validate-plugin:
    name: Validate plugin metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Fails when the plugin descriptor, task types or the `gradlePlugin { }` block stop being valid —
      # the one check that must pass before anything can be published.
      - run: ./gradlew validatePlugins --stacktrace
