# Publishing coordinates. `io.github.<user>` is the one group the Gradle Plugin Portal and Maven
# Central accept for a GitHub account, and it must be verified as owned by that account.
group=io.github.box3-galen-nv
version=1.0.0

kotlin.code.style=official
# A Gradle plugin must not add kotlin-stdlib to the consumer buildscript classpath: Gradle ships its
# own embedded Kotlin, and two stdlib copies on one classpath is how NoSuchMethodError starts.
kotlin.stdlib.default.dependency=false
